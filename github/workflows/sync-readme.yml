name: Sync README to docs/index

on:
  push:
    paths:
      - 'README.md'
  workflow_dispatch: {}

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Set up git user
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Copy README.md -> docs/index.md and commit if changed
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p docs
          cp README.md docs/index.md

          # If no change, exit successfully without committing
          if git diff --quiet -- docs/index.md; then
            echo "No changes to docs/index.md"
            exit 0
          fi

          git add docs/index.md
          git commit -m "chore: sync README.md → docs/index.md [skip ci]"
          git push
