name: Sync README to docs/index

on:
  push:
    paths:
      - "README.md"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Copy README to docs/index.md
        run: |
          mkdir -p docs
          printf -- '---\nlayout: default\n---\n' > docs/index.md
          cat README.md >> docs/index.md

      - name: Commit and push if changed
        run: |
          if git diff --quiet -- docs/index.md; then
            echo "No changes to docs/index.md"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add docs/index.md
          git commit -m "chore: sync README.md to docs/index.md [skip ci]"
          git push origin HEAD:${{ github.ref_name }}
